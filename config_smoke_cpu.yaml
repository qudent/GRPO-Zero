model:
  pretrained_model_path: "Qwen2.5-3B-Instruct"
  device: "cpu"
  dtype: "bfloat16"
data:
  path: "Countdown-Tasks-3to4"
  test_size: 128
training:
  random_seed: 1337
  max_prompt_len: 256
  max_gen_len: 16
  max_steps: 3
  batch_size: 4
  num_questions_per_batch: 2
  micro_batch_size: 1
  max_grad_norm: 1.0
  learning_rate: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
  ckpt_dir: "ckpt"
  log_dir: "logs"
  skip_unfinished_episodes: false
  ckpt_save_interval: 100
  eval_interval: 3
  text_log_episodes_per_step: 4
  memory_efficient_adamw: false
evaluation:
  use_fork_rollout: false
  max_eval_batches: 1
