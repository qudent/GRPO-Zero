model:
  pretrained_model_path: "Qwen2.5-3B-Instruct"
  device: "cuda"
  dtype: "bfloat16"
data:
  path: "Countdown-Tasks-3to4"
  test_size: 128
training:
  random_seed: 1337
  max_prompt_len: 256
  max_gen_len: 1024
  # Optional explicit training cap. null => full dataloader pass.
  max_steps: null
  batch_size: 256
  num_questions_per_batch: 32
  # Number of examples per gradient accumulation step
  micro_batch_size: 2
  max_grad_norm: 1.0
  learning_rate: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
  ckpt_dir: "ckpt"
  log_dir: "logs"
  skip_unfinished_episodes: false
  ckpt_save_interval: 100
  eval_interval: 10
  # Cap per-step text logging to reduce TensorBoard overhead.
  text_log_episodes_per_step: 4
  memory_efficient_adamw: false
evaluation:
  # If enabled, eval uses fork_rollout with no warmup fork targeting.
  use_fork_rollout: false
  # Optional cap for eval speed; null => full test split.
  max_eval_batches: null
